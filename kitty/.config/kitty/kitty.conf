# ============================================================
# Remote Control
# ============================================================
# Allow single instance mode - new windows reuse existing kitty process
# Using socket-only is safer than 'yes' — only allows control via the socket,
# not from any program running in the terminal TTY
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# ============================================================
# Theme
# ============================================================
include ~/.config/kitty/dracula.conf

# ============================================================
# Fonts
# ============================================================
font_family      jetbrains mono nerd font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
font_features    none
line_spacing     0

# ============================================================
# Cursor
# ============================================================
cursor_shape     block
cursor_trail 10
cursor_trail_decay 0.01 0.05
cursor_trail_start_threshold 0

# ============================================================
# Mouse & URLs
# ============================================================
mouse_hide_wait  1.0
url_color        #0087bd
url_style        dotted
detect_urls yes
allow_hyperlinks yes
show_hyperlink_targets yes

# ============================================================
# Scrollback
# ============================================================
scrollback_lines 10000
scrollback_pager_history_size 10

# ============================================================
# Clipboard & Paste Safety
# ============================================================
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size 512
paste_actions quote-urls-at-prompt,confirm
strip_trailing_spaces smart

# ============================================================
# Shell Integration
# ============================================================
# Enables: jump to previous prompt, browse previous command output,
# command completion notifications, clone-in-kitty, etc.
shell_integration enabled

# Notify after 30s for long-running commands when window is unfocused
notify_on_cmd_finish unfocused 30

# ============================================================
# Performance
# ============================================================
repaint_delay 10
input_delay 1
sync_to_monitor yes

# ============================================================
# Window Appearance
# ============================================================
background_opacity 0.9
dynamic_background_opacity yes

# Hide titlebar and window decorations completely
hide_window_decorations titlebar-only
macos_titlebar_color background
macos_show_window_title_in none

window_padding_width 6
window_margin_width 2
inactive_text_alpha 0.5
window_border_width 3pt
placement_strategy center
confirm_os_window_close 2

# ============================================================
# Scrollbar
# ============================================================
scrollbar scrolled

# ============================================================
# Tab Bar
# ============================================================
tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 2.0 0.0
tab_bar_style fade
tab_bar_align left
tab_bar_min_tabs 2
tab_fade 0.25 0.5 0.75 1
tab_powerline_style slanted
tab_activity_symbol 

# ============================================================
# Layouts
# ============================================================
enabled_layouts splits,tall,fat,grid,stack

# ============================================================
# macOS Specific
# ============================================================
# Make Option key send proper escape sequences for zsh
macos_option_as_alt yes

# ============================================================
# Key Mappings
# ============================================================
# cmd+hjkl for zsh menu navigation (sends escape sequences)
map cmd+h send_text all \x1bh
map cmd+j send_text all \x1bj
map cmd+k send_text all \x1bk
map cmd+l send_text all \x1bl

map cmd+n no_op
map cmd+r no_op
map cmd+q no_op

# ============================================================
# Image Rendering (Kitty Graphics Protocol)
# ============================================================
# The kitty graphics protocol is always enabled — no toggle needed.
# Images work via: kitten icat <image>, or programmatically via the protocol.
#
# For tmux passthrough, ensure tmux.conf has:
#   set -g allow-passthrough all    (✅ already set in your tmux config)
#
# To display an image inline:
#   kitten icat --place 40x20@0x0 image.png
#
# For pi coding agent image rendering (future):
#   The protocol supports sized, placed inline images that CLI tools
#   can emit directly into terminal output.
